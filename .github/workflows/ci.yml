name: CI — Qualidade, Segurança e Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-test:
    name: Verificação Estática, Varredura e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Validar sintaxe SQL das migrations
        run: |
          python -m pip install --disable-pip-version-check --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          migration_dir = Path("supabase/migrations")
          files = sorted(migration_dir.glob("*.sql"))
          errors = []

          for path in files:
              try:
                  parse_sql(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\\n".join(errors))
              raise SystemExit(1)

          print(f"SQL válido: {len(files)} migrations analisadas.")
          PY

      - name: Análise Estática de Código (ESLint)
        run: npm run lint

      - name: Compilar Aplicação para Produção (Gera routeTree.gen.ts e assets)
        run: npm run build

      - name: Verificação de Tipos TypeScript
        run: npm run typecheck

      - name: Varredura de Segredos e PII (LGPD)
        run: npm run scan:secrets

      - name: Executar Testes Automatizados (Vitest)
        run: npm run test

  database-migrations:
    name: Aplicar migrations em Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Iniciar Supabase local
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector

      - name: Aplicar todas as migrations em banco limpo
        run: supabase db reset
